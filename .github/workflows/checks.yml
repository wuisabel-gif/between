name: checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax check
        run: node --check app.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile training scripts
        run: python -m py_compile training/common.py training/validate_data.py training/sft_lora.py training/infer.py training/data/build_seed.py

      - name: Build and validate seed dataset
        run: |
          python3 training/data/build_seed.py
          python3 training/validate_data.py
